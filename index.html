<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Check Tracker</title>

  <style>
    :root {
      --ink: #1c2b33;
      --muted: #5b6b73;
      --line: #dde3e6;
      --bg: #f7f9fa;
      --panel: #ffffff;
      --ok: #1e7d4f;
      --ok-bg: #e9f7ef;
      --warn: #a45c00;
      --warn-bg: #fdf1de;
      --bad: #b3261e;
      --bad-bg: #fbe9e7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      width: 320px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      margin: 10px;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .refresh-btn {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .patient-name {
      padding: 10px 12px 0 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .patient-sub {
      padding: 2px 12px 10px 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .status-row {
      margin: 0 12px 12px 12px;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-row.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .status-row.warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .status-row.bad {
      background: var(--bad-bg);
      color: var(--bad);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: currentColor;
    }

    .status-text {
      font-weight: 600;
      font-size: 13px;
    }

    .status-sub {
      font-weight: 400;
      font-size: 12px;
      opacity: 0.9;
      margin-top: 2px;
      line-height: 1.35;
    }

    .readings {
      padding: 0 12px 12px 12px;
    }

    .readings-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .reading-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .reading-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .empty {
      padding: 8px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-note {
      padding: 8px 12px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: var(--bg);
    }

    .loading,
    .error {
      padding: 20px 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .error {
      color: var(--bad);
    }
  </style>
</head>

<body>

  <div class="panel">
    <div class="panel-header">
      <h1>BP Repeat Check</h1>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div id="content" class="loading">
      Loading patient data…
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h1>DVT Prophylaxis</h1>
    </div>

    <div id="dvtContent" class="loading">
      Loading medication data…
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <script>
    const BP_CODES = "85354-9,8480-6,8462-4";

    const DVT_DRUG_KEYWORDS = [
      "enoxaparin",
      "lovenox",
      "heparin",
      "fondaparinux",
      "arixtra",
      "dalteparin",
      "fragmin"
    ];

    const MECHANICAL_KEYWORDS = [
      "sequential compression",
      "scd",
      "compression device",
      "compression stocking"
    ];

    const contentEl = document.getElementById("content");
    const dvtContentEl = document.getElementById("dvtContent");

    document.getElementById("refreshBtn").addEventListener("click", () => {
      loadData();
      loadDvtData();
    });

    FHIR.oauth2.ready()
      .then(client => {
        window.smartClient = client;

        loadData();
        loadDvtData();
      })
      .catch(err => {
        contentEl.className = "error";
        contentEl.textContent =
          "Could not connect: " + err.message;

        dvtContentEl.className = "error";
        dvtContentEl.textContent =
          "Could not connect: " + err.message;
      });

    function loadData() {
      const client = window.smartClient;

      if (!client) return;

      contentEl.className = "loading";
      contentEl.textContent = "Loading patient data…";

      Promise.all([
        client.patient.read(),

        client.patient.request(
          `Observation?code=${BP_CODES}&_sort=date&_count=100`
        )
      ])
        .then(([patient, obsBundle]) => {
          renderBp(patient, obsBundle);
        })
        .catch(err => {
          contentEl.className = "error";
          contentEl.textContent =
            "Error loading BP data: " + err.message;
        });
    }

    function renderBp(patient, obsBundle) {
      const name = formatName(patient);

      const observations =
        (obsBundle.entry || [])
          .map(entry => entry.resource);

      // For now, use the last 24 hours as the visit window.
      const cutoff =
        Date.now() - 24 * 60 * 60 * 1000;

      const recentObservations =
        observations.filter(obs => {
          const dt = getObservationDate(obs);

          if (!dt) {
            return false;
          }

          return new Date(dt).getTime() >= cutoff;
        });

      const readings =
        extractBpReadings(recentObservations);

      let statusClass;
      let statusText;
      let statusSub;

      if (readings.length === 0) {
        statusClass = "warn";
        statusText = "No BP reading found";
        statusSub =
          "No blood pressure documented in the current 24-hour visit window.";
      }

      else {
        const firstReading = readings[0];

        const repeatRequired =
          firstReading.systolic > 140 &&
          firstReading.diastolic > 90;

        if (!repeatRequired) {
          statusClass = "ok";

          statusText =
            "No repeat BP required";

          statusSub =
            `Initial BP: ${firstReading.systolic}/${firstReading.diastolic} mmHg`;
        }

        else if (readings.length >= 2) {
          const repeatReading =
            readings[1];

          statusClass = "ok";

          statusText =
            "Repeat BP completed";

          statusSub =
            `Initial BP: ${firstReading.systolic}/${firstReading.diastolic} mmHg. ` +
            `Repeat BP: ${repeatReading.systolic}/${repeatReading.diastolic} mmHg.`;
        }

        else {
          statusClass = "bad";

          statusText =
            "Repeat BP required";

          statusSub =
            `Initial BP: ${firstReading.systolic}/${firstReading.diastolic} mmHg. ` +
            `No subsequent BP documented.`;
        }
      }

      const readingsHtml =
        readings.length

          ? readings.map((reading, index) => `
              <div class="reading-item">
                <span>
                  ${index === 0 ? "Initial" : "Repeat"}:
                  ${reading.systolic}/${reading.diastolic} mmHg
                </span>

                <span class="reading-time">
                  ${reading.time}
                </span>
              </div>
            `).join("")

          : `
              <div class="empty">
                No blood pressure readings found.
              </div>
            `;

      contentEl.className = "";

      contentEl.innerHTML = `
        <div class="patient-name">
          ${name}
        </div>

        <div class="patient-sub">
          MRN: ${patient.id}
        </div>

        <div class="status-row ${statusClass}">
          <span class="status-dot"></span>

          <div>
            <div class="status-text">
              ${statusText}
            </div>

            <div class="status-sub">
              ${statusSub}
            </div>
          </div>
        </div>

        <div class="readings">
          <div class="readings-title">
            Blood pressure readings
          </div>

          ${readingsHtml}
        </div>

        <div class="footer-note">
          Repeat required only when initial systolic is above 140
          AND initial diastolic is above 90.
          Demo app — sandbox data only. Not for clinical use.
        </div>
      `;
    }

    function extractBpReadings(observations) {
      const readings = [];

      observations.forEach(obs => {
        const dt =
          getObservationDate(obs);

        if (!dt) return;

        let systolic = null;
        let diastolic = null;

        // BP panel observation
        if (obs.component && obs.component.length) {
          obs.component.forEach(component => {
            const codes =
              (component.code?.coding || [])
                .map(coding => coding.code);

            if (
              codes.includes("8480-6") &&
              component.valueQuantity
            ) {
              systolic =
                component.valueQuantity.value;
            }

            if (
              codes.includes("8462-4") &&
              component.valueQuantity
            ) {
              diastolic =
                component.valueQuantity.value;
            }
          });
        }

        if (
          systolic !== null &&
          diastolic !== null
        ) {
          readings.push({
            systolic,
            diastolic,
            timestamp:
              new Date(dt).getTime(),

            time:
              new Date(dt).toLocaleTimeString(
                [],
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              )
          });
        }
      });

      // Oldest first.
      readings.sort(
        (a, b) =>
          a.timestamp - b.timestamp
      );

      return readings;
    }

    function getObservationDate(obs) {
      return (
        obs.effectiveDateTime ||
        (
          obs.effectivePeriod &&
          obs.effectivePeriod.start
        )
      );
    }

    function loadDvtData() {
      const client = window.smartClient;

      if (!client) return;

      dvtContentEl.className = "loading";
      dvtContentEl.textContent =
        "Loading medication data…";

      Promise.all([
        client.patient
          .request(`MedicationRequest?_count=50`)
          .catch(() => ({
            entry: []
          })),

        client.patient
          .request(`ServiceRequest?_count=50`)
          .catch(() => ({
            entry: []
          }))
      ])
        .then(([medBundle, srBundle]) => {
          renderDvt(
            medBundle,
            srBundle
          );
        })
        .catch(err => {
          dvtContentEl.className = "error";

          dvtContentEl.textContent =
            "Error loading medication data: " +
            err.message;
        });
    }

    function renderDvt(
      medBundle,
      srBundle
    ) {
      const meds =
        (medBundle.entry || [])
          .map(entry => entry.resource);

      const serviceRequests =
        (srBundle.entry || [])
          .map(entry => entry.resource);

      const pharmMatch =
        meds.find(med =>
          matchesKeywords(
            medicationText(med),
            DVT_DRUG_KEYWORDS
          )
        );

      const mechMatch =
        serviceRequests.find(sr =>
          matchesKeywords(
            serviceRequestText(sr),
            MECHANICAL_KEYWORDS
          )
        );

      let statusClass;
      let statusText;
      let statusSub;

      if (pharmMatch || mechMatch) {
        statusClass = "ok";

        statusText =
          "DVT prophylaxis on record";

        statusSub = pharmMatch
          ? `Pharmacological: ${medicationText(pharmMatch)}`
          : `Mechanical: ${serviceRequestText(mechMatch)}`;
      }

      else {
        statusClass = "bad";

        statusText =
          "No DVT prophylaxis found";

        statusSub =
          "No matching medication or device order on record";
      }

      dvtContentEl.className = "";

      dvtContentEl.innerHTML = `
        <div
          class="status-row ${statusClass}"
          style="margin-top: 10px;"
        >
          <span class="status-dot"></span>

          <div>
            <div class="status-text">
              ${statusText}
            </div>

            <div class="status-sub">
              ${statusSub}
            </div>
          </div>
        </div>

        <div class="footer-note">
          Checks for common prophylactic anticoagulants
          and compression device orders.
          Demo app — sandbox data only.
          Not for clinical use.
        </div>
      `;
    }

    function matchesKeywords(
      text,
      keywords
    ) {
      if (!text) return false;

      const lower =
        text.toLowerCase();

      return keywords.some(keyword =>
        lower.includes(keyword)
      );
    }

    function medicationText(med) {
      if (!med) return "";

      if (med.medicationCodeableConcept) {
        return (
          med.medicationCodeableConcept.text ||

          (
            med.medicationCodeableConcept.coding &&
            med.medicationCodeableConcept.coding[0] &&
            med.medicationCodeableConcept.coding[0].display
          ) ||

          ""
        );
      }

      return "";
    }

    function serviceRequestText(sr) {
      if (!sr) return "";

      return (
        sr.code &&
        (
          sr.code.text ||

          (
            sr.code.coding &&
            sr.code.coding[0] &&
            sr.code.coding[0].display
          )
        )
      ) || "";
    }

    function formatName(patient) {
      if (
        !patient.name ||
        !patient.name.length
      ) {
        return "Unknown patient";
      }

      const name =
        patient.name.find(
          item => item.use === "official"
        ) ||
        patient.name[0];

      const given =
        (name.given || []).join(" ");

      return `
        ${given}
        ${name.family || ""}
      `
        .replace(/\s+/g, " ")
        .trim();
    }
  </script>

</body>
</html>
