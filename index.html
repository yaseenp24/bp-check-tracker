<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Check Tracker</title>
<style>
  :root {
    --ink: #1c2b33;
    --muted: #5b6b73;
    --line: #dde3e6;
    --bg: #f7f9fa;
    --panel: #ffffff;
    --ok: #1e7d4f;
    --ok-bg: #e9f7ef;
    --warn: #a45c00;
    --warn-bg: #fdf1de;
    --bad: #b3261e;
    --bad-bg: #fbe9e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    width: 320px;
  }
  .panel {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    margin: 10px;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  .refresh-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .refresh-btn:hover { background: #eef1f2; }

  .patient-name {
    padding: 10px 12px 0 12px;
    font-size: 15px;
    font-weight: 600;
  }
  .patient-sub {
    padding: 2px 12px 10px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .status-row {
    margin: 0 12px 12px 12px;
    padding: 10px 12px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-row.ok   { background: var(--ok-bg);   color: var(--ok); }
  .status-row.warn { background: var(--warn-bg); color: var(--warn); }
  .status-row.bad  { background: var(--bad-bg);  color: var(--bad); }

  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
    background: currentColor;
  }
  .status-text { font-weight: 600; font-size: 13px; }
  .status-sub { font-weight: 400; font-size: 12px; opacity: 0.85; margin-top: 1px; }

  .readings {
    padding: 0 12px 12px 12px;
  }
  .readings-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .reading-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .reading-item:first-of-type { border-top: none; }
  .reading-time { color: var(--muted); font-size: 12px; }

  .empty {
    padding: 8px 0;
    color: var(--muted);
    font-size: 13px;
  }

  .footer-note {
    padding: 8px 12px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .loading, .error {
    padding: 20px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .error { color: var(--bad); }
</style>
</head>
<body>

<div class="panel" id="panel">
  <div class="panel-header">
    <h1>BP Check Tracker</h1>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
  <div id="content" class="loading">Loading patient data…</div>
</div>

<div class="panel" id="dvtPanel">
  <div class="panel-header">
    <h1>DVT Prophylaxis</h1>
  </div>
  <div id="dvtContent" class="loading">Loading medication data…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
<script>
  // BP-related LOINC codes: 85354-9 = BP panel, 8480-6 = systolic, 8462-4 = diastolic
  const BP_CODES = "85354-9,8480-6,8462-4";
  const REQUIRED_CHECKS_PER_DAY = 2; // <-- change this to match your unit's policy

  // Drug names to match for DVT (VTE) prophylaxis. Matching is done on the
  // medication's display text rather than a fixed code list, because
  // RxNorm coding varies by site and this keeps the check simple and
  // readable. For a real deployment, replace this with your hospital's
  // actual formulary codes for prophylactic anticoagulants.
  const DVT_DRUG_KEYWORDS = [
    "enoxaparin", "lovenox",
    "heparin",
    "fondaparinux", "arixtra",
    "dalteparin", "fragmin"
  ];
  // Mechanical prophylaxis (SCDs, compression devices) often isn't a clean
  // FHIR-codeable resource, but some sites document it as a ServiceRequest.
  const MECHANICAL_KEYWORDS = [
    "sequential compression", "scd", "compression device", "compression stocking"
  ];

  const contentEl = document.getElementById("content");
  const dvtContentEl = document.getElementById("dvtContent");
  document.getElementById("refreshBtn").addEventListener("click", () => {
    loadData();
    loadDvtData();
  });

  FHIR.oauth2.ready()
    .then(client => {
      window.smartClient = client;
      loadData();
      loadDvtData();
    })
    .catch(err => {
      contentEl.className = "error";
      contentEl.textContent = "Could not connect: " + err.message;
      dvtContentEl.className = "error";
      dvtContentEl.textContent = "Could not connect: " + err.message;
    });

  function hoursAgoISO(hours) {
    const d = new Date();
    d.setTime(d.getTime() - hours * 60 * 60 * 1000);
    return d.toISOString();
  }

  function loadData() {
    const client = window.smartClient;
    if (!client) return;
    contentEl.className = "loading";
    contentEl.textContent = "Loading patient data…";

    Promise.all([
      client.patient.read(),
      client.patient.request(
        `Observation?code=${BP_CODES}&date=ge2026-08-24&_sort=-date&_count=20`
      )
    ])
      .then(([patient, obsBundle]) => {
        render(patient, obsBundle);
      })
      .catch(err => {
        contentEl.className = "error";
        contentEl.textContent = "Error loading data: " + err.message;
      });
  }

  function render(patient, obsBundle) {
    const name = formatName(patient);
    const entries = (obsBundle.entry || []).map(e => e.resource);

    // Group by rough timestamp so a systolic+diastolic pair charted together
    // counts as ONE reading, not two.
    const readings = groupIntoReadings(entries);
    const count = readings.length;

    let statusClass, statusText, statusSub;
    if (count >= REQUIRED_CHECKS_PER_DAY) {
      statusClass = "ok";
      statusText = `${count} of ${REQUIRED_CHECKS_PER_DAY} BP checks in the last 24 hours`;
      statusSub = "Requirement met";
    } else if (count === 0) {
      statusClass = "bad";
      statusText = `0 of ${REQUIRED_CHECKS_PER_DAY} BP checks in the last 24 hours`;
      statusSub = "No readings yet — action needed";
    } else {
      statusClass = "warn";
      statusText = `${count} of ${REQUIRED_CHECKS_PER_DAY} BP checks in the last 24 hours`;
      statusSub = `${REQUIRED_CHECKS_PER_DAY - count} more reading needed`;
    }

    const readingsHtml = readings.length
      ? readings.map(r => `
          <div class="reading-item">
            <span>${r.display}</span>
            <span class="reading-time">${r.time}</span>
          </div>
        `).join("")
      : `<div class="empty">No readings recorded in the last 24 hours.</div>`;

    contentEl.className = "";
    contentEl.innerHTML = `
      <div class="patient-name">${name}</div>
      <div class="patient-sub">MRN: ${patient.id}</div>
      <div class="status-row ${statusClass}">
        <span class="status-dot"></span>
        <div>
          <div class="status-text">${statusText}</div>
          <div class="status-sub">${statusSub}</div>
        </div>
      </div>
      <div class="readings">
        <div class="readings-title">Readings in the last 24 hours</div>
        ${readingsHtml}
      </div>
      <div class="footer-note">Demo app — sandbox data only. Not for clinical use.</div>
    `;
  }

  function loadDvtData() {
    const client = window.smartClient;
    if (!client) return;
    dvtContentEl.className = "loading";
    dvtContentEl.textContent = "Loading medication data…";

    // Pull medication orders and (where available) service requests, and
    // filter them client-side against our keyword lists. Fetching broadly
    // and filtering in JS is simpler and more robust for a demo than
    // relying on exact code matches, which vary by site.
    Promise.all([
      client.patient.request(`MedicationRequest?_count=50`).catch(() => ({ entry: [] })),
      client.patient.request(`ServiceRequest?_count=50`).catch(() => ({ entry: [] }))
    ])
      .then(([medBundle, srBundle]) => {
        renderDvt(medBundle, srBundle);
      })
      .catch(err => {
        dvtContentEl.className = "error";
        dvtContentEl.textContent = "Error loading medication data: " + err.message;
      });
  }

  function renderDvt(medBundle, srBundle) {
    const meds = (medBundle.entry || []).map(e => e.resource);
    const serviceRequests = (srBundle.entry || []).map(e => e.resource);

    const pharmMatch = meds.find(m => matchesKeywords(medicationText(m), DVT_DRUG_KEYWORDS));
    const mechMatch = serviceRequests.find(sr => matchesKeywords(serviceRequestText(sr), MECHANICAL_KEYWORDS));

    let statusClass, statusText, statusSub;
    if (pharmMatch || mechMatch) {
      statusClass = "ok";
      statusText = "DVT prophylaxis on record";
      statusSub = pharmMatch
        ? `Pharmacological: ${medicationText(pharmMatch)}`
        : `Mechanical: ${serviceRequestText(mechMatch)}`;
    } else {
      statusClass = "bad";
      statusText = "No DVT prophylaxis found";
      statusSub = "No matching medication or device order on record";
    }

    dvtContentEl.className = "";
    dvtContentEl.innerHTML = `
      <div class="status-row ${statusClass}" style="margin-top:10px;">
        <span class="status-dot"></span>
        <div>
          <div class="status-text">${statusText}</div>
          <div class="status-sub">${statusSub}</div>
        </div>
      </div>
      <div class="footer-note">
        Checks for common prophylactic anticoagulants and compression device
        orders. Demo app — sandbox data only. Not for clinical use.
      </div>
    `;
  }

  function matchesKeywords(text, keywords) {
    if (!text) return false;
    const lower = text.toLowerCase();
    return keywords.some(k => lower.includes(k));
  }

  function medicationText(med) {
    if (!med) return "";
    if (med.medicationCodeableConcept) {
      return med.medicationCodeableConcept.text ||
        (med.medicationCodeableConcept.coding && med.medicationCodeableConcept.coding[0] &&
          med.medicationCodeableConcept.coding[0].display) || "";
    }
    return "";
  }

  function serviceRequestText(sr) {
    if (!sr) return "";
    return (sr.code && (sr.code.text ||
      (sr.code.coding && sr.code.coding[0] && sr.code.coding[0].display))) || "";
  }

  function formatName(patient) {
    if (!patient.name || !patient.name.length) return "Unknown patient";
    const n = patient.name.find(x => x.use === "official") || patient.name[0];
    const given = (n.given || []).join(" ");
    return `${given} ${n.family || ""}`.trim();
  }

  function groupIntoReadings(observations) {
    // Bucket observations into 5-minute windows so a systolic + diastolic
    // pair charted at the same time is treated as a single BP check.
    const buckets = new Map();
    observations.forEach(obs => {
      const dt = obs.effectiveDateTime || (obs.effectivePeriod && obs.effectivePeriod.start);
      if (!dt) return;
      const bucketKey = Math.floor(new Date(dt).getTime() / (5 * 60 * 1000));
      const display = describeObservation(obs);
      const time = new Date(dt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (!buckets.has(bucketKey)) {
        buckets.set(bucketKey, { time, parts: [] });
      }
      buckets.get(bucketKey).parts.push(display);
    });

    return Array.from(buckets.values())
      .map(b => ({ time: b.time, display: b.parts.join(" / ") }))
      .sort((a, b) => (a.time < b.time ? 1 : -1));
  }

  function describeObservation(obs) {
    if (obs.component && obs.component.length) {
      return obs.component
        .map(c => `${c.valueQuantity ? c.valueQuantity.value : "?"} ${c.valueQuantity ? c.valueQuantity.unit : ""}`.trim())
        .join(" / ");
    }
    if (obs.valueQuantity) {
      const label = (obs.code && obs.code.text) || "BP";
      return `${label}: ${obs.valueQuantity.value} ${obs.valueQuantity.unit || ""}`.trim();
    }
    return "BP reading";
  }
</script>

</body>
</html>
