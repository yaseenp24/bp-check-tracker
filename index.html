<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Clinical Compliance Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .status {
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.loading {
      background: #e0f2fe;
      color: #075985;
    }

    .reading {
      border-top: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    .reading:first-child {
      border-top: none;
    }

    .reading-label {
      font-weight: bold;
    }

    .reading-time {
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .medication {
      border-top: 1px solid #e5e7eb;
      padding: 10px 0;
    }

    .medication:first-child {
      border-top: none;
    }

    .small-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Clinical Compliance Assistant</h1>

    <div class="subtitle">
      Reviewing blood pressure follow-up and DVT prophylaxis documentation.
    </div>

    <div class="card">

      <h2>Blood Pressure Follow-Up</h2>

      <div
        id="bp-status"
        class="status loading"
      >
        Checking blood pressure readings...
      </div>

      <div id="bp-readings"></div>

    </div>

    <div class="card">

      <h2>DVT Prophylaxis</h2>

      <div
        id="dvt-status"
        class="status loading"
      >
        Checking DVT prophylaxis...
      </div>

      <div id="dvt-results"></div>

    </div>

  </div>

  <script>

    const BP_CODES =
      "85354-9,8480-6,8462-4";


    const DVT_DRUG_KEYWORDS = [

      "heparin",

      "enoxaparin",
      "lovenox",

      "dalteparin",
      "fragmin",

      "fondaparinux",
      "arixtra",

      "rivaroxaban",
      "xarelto",

      "apixaban",
      "eliquis",

      "warfarin",
      "coumadin"

    ];


    const MECHANICAL_KEYWORDS = [

      "sequential compression",
      "scd",
      "compression device",
      "compression stocking"

    ];


    FHIR.oauth2.ready()

      .then(async client => {

        console.log(
          "Patient ID:",
          client.patient.id
        );

        console.log(
          "Encounter ID:",
          client.encounter
            ? client.encounter.id
            : "No encounter context"
        );


        await Promise.all([

          checkBloodPressure(client),

          checkDvtProphylaxis(client)

        ]);

      })

      .catch(error => {

        console.error(
          "SMART launch error:",
          error
        );

        document.getElementById(
          "bp-status"
        ).className = "status danger";

        document.getElementById(
          "bp-status"
        ).textContent =
          "Unable to load patient data.";

        document.getElementById(
          "dvt-status"
        ).className = "status danger";

        document.getElementById(
          "dvt-status"
        ).textContent =
          "Unable to load patient data.";

      });


    async function checkBloodPressure(client) {

      const statusElement =
        document.getElementById("bp-status");

      const readingsElement =
        document.getElementById("bp-readings");


      try {

        const response =
          await client.patient.request(

            `Observation?code=${BP_CODES}&_sort=-date&_count=100`

          );


        const observations =
          getBundleResources(response);


        const cutoff =
          Date.now() -
          24 * 60 * 60 * 1000;


        const recentObservations =
          observations.filter(obs => {

            const dt =
              getObservationDate(obs);

            if (!dt) {
              return false;
            }

            return (
              new Date(dt).getTime() >= cutoff
            );

          });


        const readings =
          extractBpReadings(
            recentObservations
          );


        if (readings.length === 0) {

          statusElement.className =
            "status warning";

          statusElement.textContent =
            "No BP reading found in the last 24 hours.";

          readingsElement.innerHTML = "";

          return;

        }


        const firstReading =
          readings[0];


        const repeatRequired =

          firstReading.systolic > 140 &&

          firstReading.diastolic > 90;


        if (!repeatRequired) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "No repeat BP required.";

        }

        else if (readings.length >= 2) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "Repeat BP completed.";

        }

        else {

          statusElement.className =
            "status danger";

          statusElement.textContent =
            "Repeat BP required.";

        }


        displayBpReadings(
          readings,
          readingsElement
        );

      }

      catch (error) {

        console.error(
          "BP error:",
          error
        );

        statusElement.className =
          "status danger";

        statusElement.textContent =
          "Unable to retrieve blood pressure data.";

      }

    }


    function extractBpReadings(
      observations
    ) {

      const readings = [];


      observations.forEach(obs => {

        const dt =
          getObservationDate(obs);


        if (!dt) {
          return;
        }


        let systolic = null;

        let diastolic = null;


        if (
          obs.component &&
          obs.component.length
        ) {

          obs.component.forEach(
            component => {

              const codes =

                (
                  component.code?.coding || []
                )

                .map(
                  coding => coding.code
                );


              if (
                codes.includes("8480-6") &&
                component.valueQuantity
              ) {

                systolic =
                  component
                    .valueQuantity
                    .value;

              }


              if (
                codes.includes("8462-4") &&
                component.valueQuantity
              ) {

                diastolic =
                  component
                    .valueQuantity
                    .value;

              }

            });

        }


        if (
          systolic !== null &&
          diastolic !== null
        ) {

          readings.push({

            systolic,

            diastolic,

            timestamp:
              new Date(dt).getTime(),

            time:
              new Date(dt)
                .toLocaleString()

          });

        }

      });


      readings.sort(
        (a, b) =>
          a.timestamp -
          b.timestamp
      );


      return readings;

    }


    function displayBpReadings(
      readings,
      container
    ) {

      container.innerHTML = "";


      readings.forEach(
        (reading, index) => {

          const div =
            document.createElement("div");

          div.className =
            "reading";


          let label =
            "Additional BP";


          if (index === 0) {

            label =
              "Initial BP";

          }

          else if (index === 1) {

            label =
              "Repeat BP";

          }


          div.innerHTML = `

            <div class="reading-label">

              ${label}:
              ${reading.systolic}/${reading.diastolic}
              mmHg

            </div>

            <div class="reading-time">

              ${reading.time}

            </div>

          `;


          container.appendChild(div);

        });

    }


    function getObservationDate(obs) {

      return (

        obs.effectiveDateTime ||

        (
          obs.effectivePeriod &&
          obs.effectivePeriod.start
        )

      );

    }


    /*
      ------------------------------------------------------
      MANUAL MEDICATION PAGINATION
      ------------------------------------------------------

      Cerner can return MedicationRequest history across
      multiple pages using a Bundle "next" link.

      This function follows every next link and combines
      the results.

      FIX (see conversation): previously, if ANY page after
      the first one failed, the whole function threw and every
      medication already collected (including page 1) was lost,
      because the try/catch lived around the *entire call* in
      checkDvtProphylaxis rather than around each page fetch.
      That silently produced "No DVT prophylaxis found" even
      when matching medications existed on page 1.

      Now: page 1 has its own try/catch. Every later page is
      caught individually inside the loop — if a later page
      fails, we stop paginating but KEEP everything gathered
      so far instead of discarding it.
    */

    async function getAllMedicationRequests(client) {

      let allMedications = [];

      let page = 1;


      let response;

      try {

        response =
          await client.patient.request(
            "MedicationRequest?_count=100"
          );

      }

      catch (error) {

        console.error(
          "MedicationRequest first page failed:",
          error
        );

        return allMedications; // [] — nothing to salvage yet

      }


      while (response) {

        const resources =
          getBundleResources(response);


        allMedications.push(
          ...resources
        );


        console.log(
          `Medication page ${page}:`,
          resources.length
        );


        const nextLink =
          response.link?.find(
            link =>
              link.relation === "next"
          )?.url;


        if (!nextLink) {

          break;

        }


        /*
          Safety limit so a strange server response
          cannot create an infinite loop.
        */

        if (page >= 50) {

          console.warn(
            "Stopped after 50 medication pages."
          );

          break;

        }


        /*
          Use client.request here because nextLink
          is already a complete FHIR URL supplied
          by Cerner.
        */

        try {

          response =
            await client.request(
              nextLink
            );

          page++;

        }

        catch (error) {

          console.error(
            `Medication page ${page + 1} failed — stopping pagination, keeping ${allMedications.length} results collected so far.`,
            error
          );

          break; // keep allMedications as-is, just stop paginating

        }

      }


      console.log(
        "TOTAL medications retrieved:",
        allMedications.length
      );


      return allMedications;

    }


    async function checkDvtProphylaxis(
      client
    ) {

      const statusElement =
        document.getElementById(
          "dvt-status"
        );

      const resultsElement =
        document.getElementById(
          "dvt-results"
        );


      try {

        let medications = [];

        let serviceRequests = [];


        /*
          ---------------------------------
          MEDICATION REQUESTS
          ---------------------------------

          This now follows Cerner's pagination
          manually, and no longer loses partial
          results if a later page fails.
        */

        try {

          medications =
            await getAllMedicationRequests(
              client
            );


          console.log(
            "MedicationRequests:",
            medications
          );

        }

        catch (error) {

          console.error(
            "MedicationRequest error:",
            error
          );

        }


        /*
          ---------------------------------
          SERVICE REQUESTS
          ---------------------------------

          Keep this separate so failure here
          does not prevent medication detection.
        */

        try {

          const serviceResponse =
            await client.patient.request(
              "ServiceRequest?_count=100"
            );


          serviceRequests =
            getBundleResources(
              serviceResponse
            );


          console.log(
            "ServiceRequests:",
            serviceRequests
          );

        }

        catch (error) {

          console.warn(
            "ServiceRequest unavailable:",
            error
          );

        }


        /*
          ---------------------------------
          FIND ANTICOAGULANT MEDICATIONS
          ---------------------------------
        */

        const matchingMedications =

          medications.filter(
            medication => {

              const text =
                getMedicationText(
                  medication
                ).toLowerCase();


              const matchedKeyword =
                DVT_DRUG_KEYWORDS.find(
                  keyword =>
                    text.includes(
                      keyword.toLowerCase()
                    )
                );


              if (matchedKeyword) {

                console.log(
                  "DVT MEDICATION MATCH:",
                  matchedKeyword,
                  medication
                );

              }


              return Boolean(
                matchedKeyword
              );

            }
          );


        /*
          ---------------------------------
          FIND MECHANICAL PROPHYLAXIS
          ---------------------------------
        */

        const matchingMechanicalOrders =

          serviceRequests.filter(
            request => {

              const text =
                getServiceRequestText(
                  request
                ).toLowerCase();


              return MECHANICAL_KEYWORDS.some(
                keyword =>
                  text.includes(
                    keyword.toLowerCase()
                  )
              );

            }
          );


        console.log(
          "Matching anticoagulants:",
          matchingMedications
        );


        console.log(
          "Matching mechanical orders:",
          matchingMechanicalOrders
        );


        /*
          ---------------------------------
          DISPLAY RESULT
          ---------------------------------
        */

        if (

          matchingMedications.length > 0 ||

          matchingMechanicalOrders.length > 0

        ) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "DVT prophylaxis documented.";

        }

        else {

          statusElement.className =
            "status warning";

          statusElement.textContent =
            "No DVT prophylaxis found.";

        }


        displayDvtResults(

          matchingMedications,

          matchingMechanicalOrders,

          resultsElement

        );

      }

      catch (error) {

        console.error(
          "DVT error:",
          error
        );

        statusElement.className =
          "status danger";

        statusElement.textContent =
          "Unable to retrieve DVT prophylaxis data.";

      }

    }


    function getMedicationText(
      medicationRequest
    ) {

      const pieces = [];


      if (
        medicationRequest
          .medicationCodeableConcept
          ?.text
      ) {

        pieces.push(

          medicationRequest
            .medicationCodeableConcept
            .text

        );

      }


      const coding =

        medicationRequest
          .medicationCodeableConcept
          ?.coding || [];


      coding.forEach(code => {

        if (code.display) {

          pieces.push(
            code.display
          );

        }

      });


      const dosage =

        medicationRequest
          .dosageInstruction || [];


      dosage.forEach(
        instruction => {

          if (
            instruction.text
          ) {

            pieces.push(
              instruction.text
            );

          }


          const additional =

            instruction
              .additionalInstruction ||
            [];


          additional.forEach(
            item => {

              if (item.text) {

                pieces.push(
                  item.text
                );

              }

            });

        });


      return pieces.join(" ");

    }


    function getServiceRequestText(
      serviceRequest
    ) {

      const pieces = [];


      if (
        serviceRequest.code?.text
      ) {

        pieces.push(
          serviceRequest.code.text
        );

      }


      const coding =
        serviceRequest
          .code
          ?.coding || [];


      coding.forEach(code => {

        if (code.display) {

          pieces.push(
            code.display
          );

        }

      });


      return pieces.join(" ");

    }


    function displayDvtResults(

      medications,

      mechanicalOrders,

      container

    ) {

      container.innerHTML = "";


      if (
        medications.length > 0
      ) {

        const heading =
          document.createElement("div");

        heading.className =
          "small-text";

        heading.innerHTML =
          "<strong>Anticoagulant medication found:</strong>";


        container.appendChild(
          heading
        );


        medications.forEach(
          medication => {

            const div =
              document.createElement("div");

            div.className =
              "medication";


            const name =
              getMedicationDisplayName(
                medication
              );


            const status =
              medication.status ||
              "unknown";


            const authoredOn =
              medication.authoredOn
                ? new Date(
                    medication.authoredOn
                  ).toLocaleString()
                : "Unknown";


            div.innerHTML = `

              <strong>
                ${name}
              </strong>

              <div class="small-text">

                Status:
                ${status}

              </div>

              <div class="small-text">

                Ordered:
                ${authoredOn}

              </div>

            `;


            container.appendChild(div);

          });

      }


      if (
        mechanicalOrders.length > 0
      ) {

        const heading =
          document.createElement("div");

        heading.className =
          "small-text";

        heading.style.marginTop =
          "14px";

        heading.innerHTML =
          "<strong>Mechanical prophylaxis found:</strong>";


        container.appendChild(
          heading
        );


        mechanicalOrders.forEach(
          request => {

            const div =
              document.createElement("div");

            div.className =
              "medication";


            div.textContent =
              getServiceRequestText(
                request
              );


            container.appendChild(div);

          });

      }


      if (

        medications.length === 0 &&

        mechanicalOrders.length === 0

      ) {

        container.innerHTML = `

          <div class="small-text">

            No matching anticoagulant medication or
            mechanical compression order was found.

          </div>

        `;

      }

    }


    function getMedicationDisplayName(
      medication
    ) {

      if (
        medication
          .medicationCodeableConcept
          ?.text
      ) {

        return medication
          .medicationCodeableConcept
          .text;

      }


      const coding =
        medication
          .medicationCodeableConcept
          ?.coding || [];


      const display =
        coding.find(
          code => code.display
        );


      if (display) {

        return display.display;

      }


      return "Anticoagulant medication";

    }


    function getBundleResources(
      response
    ) {

      if (!response) {
        return [];
      }


      if (
        response.resourceType ===
        "Bundle"
      ) {

        return (

          response.entry || []

        )

        .map(
          entry => entry.resource
        )

        .filter(Boolean);

      }


      if (
        Array.isArray(response)
      ) {

        return response;

      }


      return [];

    }

  </script>

</body>
</html>
