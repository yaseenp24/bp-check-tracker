<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Clinical Compliance Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .status {
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.loading {
      background: #e0f2fe;
      color: #075985;
    }

    .reading {
      border-top: 1px solid #e5e7eb;
      padding: 12px 0;
    }

    .reading:first-child {
      border-top: none;
    }

    .reading-label {
      font-weight: bold;
    }

    .reading-time {
      color: #6b7280;
      font-size: 14px;
      margin-top: 4px;
    }

    .medication {
      border-top: 1px solid #e5e7eb;
      padding: 10px 0;
    }

    .medication:first-child {
      border-top: none;
    }

    .small-text {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Clinical Compliance Assistant</h1>

    <div class="subtitle">
      Reviewing blood pressure follow-up and DVT prophylaxis documentation.
    </div>

    <!-- Blood Pressure Card -->
    <div class="card">

      <h2>Blood Pressure Follow-Up</h2>

      <div
        id="bp-status"
        class="status loading"
      >
        Checking blood pressure readings...
      </div>

      <div id="bp-readings"></div>

    </div>

    <!-- DVT Card -->
    <div class="card">

      <h2>DVT Prophylaxis</h2>

      <div
        id="dvt-status"
        class="status loading"
      >
        Checking DVT prophylaxis...
      </div>

      <div id="dvt-results"></div>

    </div>

  </div>

  <script>

    /*
      ------------------------------------------------------
      BLOOD PRESSURE CONFIGURATION
      ------------------------------------------------------
    */

    const BP_CODES = "85354-9,8480-6,8462-4";


    /*
      ------------------------------------------------------
      DVT / ANTICOAGULANT MEDICATIONS
      ------------------------------------------------------

      For this sandbox prototype, the app checks for
      medication names containing any of these keywords.

      IMPORTANT:
      In production, a medication being present does not
      automatically prove that a hospital's specific VTE
      prophylaxis measure has been satisfied.

      Eventually we should also consider:

      - current encounter
      - dose
      - route
      - timing
      - indication
      - medication status
    */

    const DVT_DRUG_KEYWORDS = [

      // Unfractionated heparin
      "heparin",

      // Low-molecular-weight heparins
      "enoxaparin",
      "lovenox",

      "dalteparin",
      "fragmin",

      // Factor Xa inhibitor
      "fondaparinux",
      "arixtra",

      // Direct oral anticoagulants
      "rivaroxaban",
      "xarelto",

      "apixaban",
      "eliquis",

      // Vitamin K antagonist
      "warfarin",
      "coumadin"

    ];


    /*
      ------------------------------------------------------
      MECHANICAL DVT PROPHYLAXIS
      ------------------------------------------------------
    */

    const MECHANICAL_KEYWORDS = [

      "sequential compression",
      "scd",
      "compression device",
      "compression stocking"

    ];


    /*
      ------------------------------------------------------
      START SMART APP
      ------------------------------------------------------
    */

    FHIR.oauth2.ready()

      .then(async client => {

        console.log(
          "Patient ID:",
          client.patient.id
        );

        console.log(
          "Encounter ID:",
          client.encounter
            ? client.encounter.id
            : "No encounter context"
        );


        await Promise.all([

          checkBloodPressure(client),

          checkDvtProphylaxis(client)

        ]);

      })

      .catch(error => {

        console.error(
          "SMART launch error:",
          error
        );

        document.getElementById(
          "bp-status"
        ).className = "status danger";

        document.getElementById(
          "bp-status"
        ).textContent =
          "Unable to load patient data.";

        document.getElementById(
          "dvt-status"
        ).className = "status danger";

        document.getElementById(
          "dvt-status"
        ).textContent =
          "Unable to load patient data.";

      });


    /*
      ------------------------------------------------------
      BLOOD PRESSURE CHECK
      ------------------------------------------------------

      Current rule:

      Look at the FIRST BP during the evaluation window.

      If:

          systolic > 140
                  AND
          diastolic > 90

      then another BP must be documented afterward.

      The repeat BP value itself does NOT matter.

      NOTE:
      We are currently using the previous 24 hours as our
      temporary sandbox window.

      Production version should use the current encounter.
    */

    async function checkBloodPressure(client) {

      const statusElement =
        document.getElementById("bp-status");

      const readingsElement =
        document.getElementById("bp-readings");

      try {

        const response =
          await client.patient.request(

            `Observation?code=${BP_CODES}&_sort=-date&_count=100`

          );


        const observations = getBundleResources(response);


        /*
          Filter locally instead of relying on Cerner's
          server-side date parameter.
        */

        const cutoff =
          Date.now() -
          24 * 60 * 60 * 1000;


        const recentObservations =
          observations.filter(obs => {

            const dt =
              getObservationDate(obs);

            if (!dt) {
              return false;
            }

            return (
              new Date(dt).getTime() >= cutoff
            );

          });


        const readings =
          extractBpReadings(
            recentObservations
          );


        if (readings.length === 0) {

          statusElement.className =
            "status warning";

          statusElement.textContent =
            "No BP reading found in the last 24 hours.";

          readingsElement.innerHTML = "";

          return;

        }


        /*
          Readings are sorted oldest -> newest.
        */

        const firstReading =
          readings[0];


        const repeatRequired =

          firstReading.systolic > 140 &&

          firstReading.diastolic > 90;


        /*
          CASE 1:
          Initial BP does NOT meet both thresholds.
        */

        if (!repeatRequired) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "No repeat BP required.";

        }


        /*
          CASE 2:
          Initial BP is high AND at least one later
          BP exists.
        */

        else if (readings.length >= 2) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "Repeat BP completed.";

        }


        /*
          CASE 3:
          Initial BP is high and there is no later BP.
        */

        else {

          statusElement.className =
            "status danger";

          statusElement.textContent =
            "Repeat BP required.";

        }


        displayBpReadings(
          readings,
          readingsElement
        );

      }

      catch (error) {

        console.error(
          "BP error:",
          error
        );

        statusElement.className =
          "status danger";

        statusElement.textContent =
          "Unable to retrieve blood pressure data.";

      }

    }


    /*
      ------------------------------------------------------
      EXTRACT BP READINGS
      ------------------------------------------------------

      Each BP panel Observation is treated as its own
      blood-pressure event.

      We DO NOT combine observations using a 5-minute
      bucket because that could accidentally combine
      an initial BP and a true repeat BP.
    */

    function extractBpReadings(observations) {

      const readings = [];


      observations.forEach(obs => {

        const dt =
          getObservationDate(obs);


        if (!dt) {
          return;
        }


        let systolic = null;

        let diastolic = null;


        if (
          obs.component &&
          obs.component.length
        ) {

          obs.component.forEach(
            component => {

              const codes =

                (
                  component.code?.coding || []
                )

                .map(
                  coding => coding.code
                );


              /*
                Systolic
              */

              if (

                codes.includes("8480-6") &&

                component.valueQuantity

              ) {

                systolic =
                  component
                    .valueQuantity
                    .value;

              }


              /*
                Diastolic
              */

              if (

                codes.includes("8462-4") &&

                component.valueQuantity

              ) {

                diastolic =
                  component
                    .valueQuantity
                    .value;

              }

            });

        }


        /*
          Only count complete BP panels.
        */

        if (

          systolic !== null &&

          diastolic !== null

        ) {

          readings.push({

            systolic,

            diastolic,

            timestamp:
              new Date(dt).getTime(),

            date:
              new Date(dt),

            time:
              new Date(dt)
                .toLocaleString()

          });

        }

      });


      /*
        Oldest reading first.
      */

      readings.sort(
        (a, b) =>
          a.timestamp -
          b.timestamp
      );


      return readings;

    }


    /*
      ------------------------------------------------------
      DISPLAY BP READINGS
      ------------------------------------------------------
    */

    function displayBpReadings(
      readings,
      container
    ) {

      container.innerHTML = "";


      readings.forEach(
        (reading, index) => {

          const div =
            document.createElement("div");

          div.className =
            "reading";


          let label =
            "Additional BP";


          if (index === 0) {

            label =
              "Initial BP";

          }

          else if (index === 1) {

            label =
              "Repeat BP";

          }


          div.innerHTML = `

            <div class="reading-label">

              ${label}:
              ${reading.systolic}/${reading.diastolic}
              mmHg

            </div>

            <div class="reading-time">

              ${reading.time}

            </div>

          `;


          container.appendChild(div);

        });

    }


    /*
      ------------------------------------------------------
      OBSERVATION DATE
      ------------------------------------------------------
    */

    function getObservationDate(obs) {

      return (

        obs.effectiveDateTime ||

        (
          obs.effectivePeriod &&
          obs.effectivePeriod.start
        )

      );

    }


    /*
      ------------------------------------------------------
      DVT PROPHYLAXIS CHECK
      ------------------------------------------------------
    */

    async function checkDvtProphylaxis(client) {

      const statusElement =
        document.getElementById(
          "dvt-status"
        );

      const resultsElement =
        document.getElementById(
          "dvt-results"
        );


      try {

        /*
          Retrieve medication orders and procedure/service
          orders separately.
        */

        const [
          medicationResponse,
          serviceResponse
        ] = await Promise.all([

          client.patient.request(
            "MedicationRequest?_count=100"
          ),

          client.patient.request(
            "ServiceRequest?_count=100"
          )

        ]);


        const medications =
          getBundleResources(
            medicationResponse
          );


        const serviceRequests =
          getBundleResources(
            serviceResponse
          );


        /*
          Find matching anticoagulant medications.
        */

        const matchingMedications =

          medications.filter(
            medication => {

              const text =
                getMedicationText(
                  medication
                ).toLowerCase();


              return DVT_DRUG_KEYWORDS.some(
                keyword =>
                  text.includes(keyword)
              );

            });


        /*
          Find mechanical prophylaxis orders.
        */

        const matchingMechanicalOrders =

          serviceRequests.filter(
            request => {

              const text =
                getServiceRequestText(
                  request
                ).toLowerCase();


              return MECHANICAL_KEYWORDS.some(
                keyword =>
                  text.includes(keyword)
              );

            });


        /*
          Something qualifying was found.
        */

        if (

          matchingMedications.length > 0 ||

          matchingMechanicalOrders.length > 0

        ) {

          statusElement.className =
            "status success";

          statusElement.textContent =
            "DVT prophylaxis documented.";

        }

        else {

          statusElement.className =
            "status warning";

          statusElement.textContent =
            "No DVT prophylaxis found.";

        }


        displayDvtResults(

          matchingMedications,

          matchingMechanicalOrders,

          resultsElement

        );

      }

      catch (error) {

        console.error(
          "DVT error:",
          error
        );

        statusElement.className =
          "status danger";

        statusElement.textContent =
          "Unable to retrieve DVT prophylaxis data.";

      }

    }


    /*
      ------------------------------------------------------
      MEDICATION TEXT
      ------------------------------------------------------
    */

    function getMedicationText(
      medicationRequest
    ) {

      const pieces = [];


      /*
        Main medication text.
      */

      if (
        medicationRequest
          .medicationCodeableConcept
          ?.text
      ) {

        pieces.push(

          medicationRequest
            .medicationCodeableConcept
            .text

        );

      }


      /*
        Coding displays.
      */

      const coding =

        medicationRequest
          .medicationCodeableConcept
          ?.coding || [];


      coding.forEach(code => {

        if (code.display) {

          pieces.push(
            code.display
          );

        }

      });


      /*
        Dosage text can sometimes include brand names.
      */

      const dosage =

        medicationRequest
          .dosageInstruction || [];


      dosage.forEach(
        instruction => {

          if (instruction.text) {

            pieces.push(
              instruction.text
            );

          }


          const additional =

            instruction
              .additionalInstruction ||
            [];


          additional.forEach(
            item => {

              if (item.text) {

                pieces.push(
                  item.text
                );

              }

            });

        });


      return pieces.join(" ");

    }


    /*
      ------------------------------------------------------
      SERVICE REQUEST TEXT
      ------------------------------------------------------
    */

    function getServiceRequestText(
      serviceRequest
    ) {

      const pieces = [];


      if (
        serviceRequest.code?.text
      ) {

        pieces.push(
          serviceRequest.code.text
        );

      }


      const coding =
        serviceRequest
          .code
          ?.coding || [];


      coding.forEach(code => {

        if (code.display) {

          pieces.push(
            code.display
          );

        }

      });


      return pieces.join(" ");

    }


    /*
      ------------------------------------------------------
      DISPLAY DVT RESULTS
      ------------------------------------------------------
    */

    function displayDvtResults(

      medications,

      mechanicalOrders,

      container

    ) {

      container.innerHTML = "";


      /*
        Display matching medications.
      */

      if (medications.length > 0) {

        const heading =
          document.createElement("div");

        heading.className =
          "small-text";

        heading.innerHTML =
          "<strong>Anticoagulant medication found:</strong>";

        container.appendChild(
          heading
        );


        medications.forEach(
          medication => {

            const div =
              document.createElement("div");

            div.className =
              "medication";


            const name =
              getMedicationText(
                medication
              );


            const status =
              medication.status ||
              "unknown";


            div.innerHTML = `

              <strong>
                ${name}
              </strong>

              <div class="small-text">

                MedicationRequest status:
                ${status}

              </div>

            `;


            container.appendChild(div);

          });

      }


      /*
        Display matching mechanical prophylaxis.
      */

      if (
        mechanicalOrders.length > 0
      ) {

        const heading =
          document.createElement("div");

        heading.className =
          "small-text";

        heading.style.marginTop =
          "14px";

        heading.innerHTML =
          "<strong>Mechanical prophylaxis found:</strong>";

        container.appendChild(
          heading
        );


        mechanicalOrders.forEach(
          request => {

            const div =
              document.createElement("div");

            div.className =
              "medication";


            div.textContent =
              getServiceRequestText(
                request
              );


            container.appendChild(div);

          });

      }


      /*
        Nothing found.
      */

      if (

        medications.length === 0 &&

        mechanicalOrders.length === 0

      ) {

        container.innerHTML = `

          <div class="small-text">

            No matching anticoagulant medication or
            mechanical compression order was found.

          </div>

        `;

      }

    }


    /*
      ------------------------------------------------------
      FHIR BUNDLE HELPER
      ------------------------------------------------------
    */

    function getBundleResources(response) {

      if (!response) {
        return [];
      }


      /*
        Standard FHIR Bundle.
      */

      if (
        response.resourceType ===
        "Bundle"
      ) {

        return (

          response.entry || []

        )

        .map(
          entry => entry.resource
        )

        .filter(Boolean);

      }


      /*
        fhirclient can sometimes return arrays depending
        on request configuration.
      */

      if (Array.isArray(response)) {

        return response;

      }


      return [];

    }

  </script>

</body>
</html>
